# Builds the downloadable .dmg for a release and attaches it to the GitHub
# Release for the tag.
#
# This is the *unsigned* download path: there is no Developer ID certificate in
# CI, so the app carries no signature and no notarization ticket, and macOS
# quarantines it on download. The release notes tell people how to open it. The
# signed, notarized, Sparkle-updating path is still `bun scripts/release.ts` on
# a maintainer's machine — see RELEASING.md.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release and upload the .dmg to it

jobs:
  dmg:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          # libghostty-spm is a submodule; without it the app target won't link.
          submodules: recursive

      - name: Select Xcode 27 or newer
        # The project is saved in a format earlier Xcode versions refuse to open
        # (see CONTRIBUTING.md), so fail with the runner's inventory rather than
        # a confusing parse error from xcodebuild.
        run: |
          newest=""
          for app in /Applications/Xcode*.app; do
            [ -d "$app" ] || continue
            version=$(plutil -extract CFBundleShortVersionString raw "$app/Contents/Info.plist" 2>/dev/null) || continue
            case "${version%%.*}" in
              ''|*[!0-9]*) continue ;;
            esac
            if [ "${version%%.*}" -ge 27 ]; then
              newest="$app"
            fi
          done
          if [ -z "$newest" ]; then
            echo "::error::No Xcode 27+ on this runner. Installed:"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          echo "Using $newest"
          sudo xcode-select -s "$newest/Contents/Developer"
          xcodebuild -version

      - name: Install the Rust targets the bridge builds
        # scripts/build-alacritty-bridge.sh builds one slice per architecture in
        # $ARCHS and refuses to install targets itself (the build-phase sandbox
        # can't write to ~/.rustup), so both slices of a universal build have to
        # exist before xcodebuild starts.
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Build the app (Release, unsigned)
        # Unsigned, not ad-hoc: an ad-hoc signature plus ENABLE_HARDENED_RUNTIME
        # trips Library Validation on the embedded Sparkle.framework and the app
        # dies at launch. Same reasoning as the Makefile.
        run: |
          xcodebuild \
            -project terminal.xcodeproj \
            -scheme terminal \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build

      - name: Check the tag against the version in the build
        id: version
        run: |
          app="build/dd/Build/Products/Release/Terminal.app"
          [ -d "$app" ] || { echo "::error::No app at $app"; exit 1; }
          version=$(plutil -extract CFBundleShortVersionString raw "$app/Contents/Info.plist")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match MARKETING_VERSION $version — bump the project or retag."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "app=$app" >> "$GITHUB_OUTPUT"

      - name: Package the .dmg
        # hdiutil rather than create-dmg: the pretty window layout create-dmg
        # produces needs Finder scripting, which is unreliable on a headless
        # runner. A folder with the app and an Applications symlink installs the
        # same way, just without the arranged icons.
        id: dmg
        env:
          VERSION: ${{ steps.version.outputs.version }}
          APP: ${{ steps.version.outputs.app }}
        run: |
          staging=build/dmg
          rm -rf "$staging" && mkdir -p "$staging"
          ditto "$APP" "$staging/Terminal.app"
          ln -s /Applications "$staging/Applications"
          dmg="build/terminal-$VERSION.dmg"
          hdiutil create -volname "Terminal $VERSION" -srcfolder "$staging" \
            -fs HFS+ -format UDZO -ov "$dmg"
          echo "dmg=$dmg" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Publish the release
        # The release may already exist (created by hand when tagging), in which
        # case only the .dmg is added; otherwise it's created here with this
        # version's CHANGELOG section as its notes.
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          DMG: ${{ steps.dmg.outputs.dmg }}
        run: |
          bun scripts/changelog.ts "$VERSION" > build/notes.md
          cat >> build/notes.md <<'NOTES'

          ---

          This build is not signed with a Developer ID or notarized, so macOS
          quarantines it. After dragging Terminal to Applications, run:

              xattr -dr com.apple.quarantine /Applications/Terminal.app
          NOTES
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$DMG" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$DMG" \
              --title "terminal $VERSION" \
              --notes-file build/notes.md
          fi
